name: Release image

# Push a tag `v<package.json version>-sysblok.<N>`, e.g. v0.3.0-sysblok.1.
on:
  push:
    tags: ["v*-sysblok.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          base=$(node -p 'require("./package.json").version')
          case "$GITHUB_REF_NAME" in
            "v${base}-sysblok."*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not start with v${base}-sysblok." >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=planka-mcp
            org.opencontainers.image.description=Planka 2.x MCP server (stdio), sysblok fork of omnicoreos/planka-mcp
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`"
